version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: razorguard_postgres
    restart: always
    environment:
      POSTGRES_USER: razorguard
      POSTGRES_PASSWORD: razorguard_secret
      POSTGRES_DB: razorguard_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U razorguard -d razorguard_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: razorguard_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://razorguard:razorguard_secret@postgres:5432/razorguard_db
      - ENVIRONMENT=production
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: razorguard_frontend
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
